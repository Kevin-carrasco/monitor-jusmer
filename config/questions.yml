consent_understand:
  index: 1
  type: mc
  label:
  - Si acepta participar en este estudio, por favor haga clic en la celda de abajo
    que indica que acepta participar voluntariamente. Al aceptar participar usted
    declara que lo hace de forma informada, es decir, que ha leído y comprendido las
    condiciones de su participación en este estudio en los términos antes señalados,
    y ha tenido la oportunidad de hacer preguntas y que estas sean respondidas, sin
    que le queden dudas al respecto. Una vez que acepte participar haciendo clic en
    la celda respectiva, se le dará acceso a la encuesta del estudio.
